<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body>
  <h2>Student Login</h2>
  <input id="student-matric" placeholder="Matric"><br><br>
  <input id="student-password" type="password" placeholder="Password"><br><br>
  <button onclick="loginStudent()">Login</button>

  <hr>

  <h2>Admin Login</h2>
  <input id="admin-email" placeholder="Email"><br><br>
  <input id="admin-password" type="password" placeholder="Password"><br><br>
  <button onclick="loginAdmin()">Login</button>

  <hr>

  <h2>Register Student</h2>
  <input id="register-name" placeholder="Name"><br><br>
  <input id="register-matric" placeholder="Matric"><br><br>
  <input id="register-password" type="password" placeholder="Password"><br><br>
  <button onclick="registerStudent()">Register</button>

  <script src="sendStudentData.js"></script>
</body>
</html>
