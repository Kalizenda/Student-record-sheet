<!DOCTYPE html>
<html>
    <head>Student Results</head>


    <body> 



<h2>Student Login</h2>
<input id="student-matric" placeholder="Matric"><br><br>
<input id="student-password" type="password" placeholder="Password"><br><br>
<button onclick="loginStudent()">Login</button>

<hr>

<h2>Admin Login</h2>
<input id="admin-email" placeholder="Email"><br><br>
<input id="admin-password" type="password" placeholder="Password"><br><br>
<button onclick="loginAdmin()">Login</button>

<hr>

<h2>Register Student</h2>
<input id="register-name" placeholder="Name"><br><br>
<input id="register-matric" placeholder="Matric"><br><br>
<input id="register-password" type="password" placeholder="Password"><br><br>
<button onclick="registerStudent()">Register</button>

        <hr>








<h2>Admin add Student</h2>
<input type="text" id="adminadd-name" placeholder="Student Name"><br><br>
<input type="text" id="adminadd-matric" placeholder="Matric Number"><br><br>
<input type="text" id="adminadd-level" placeholder="Level"><br><br>

<h3>Scores</h3>
<input type="number" id="adminadd-metaphysics" placeholder="Metaphysics"><br><br>
<input type="number" id="adminadd-epistemology" placeholder="Epistemology"><br><br>
<input type="number" id="adminadd-psychology" placeholder="Psychology"><br><br>
<button onclick="addStudent()">Submit</button>

        <hr>

        <h2>All Students</h2>
        <button onclick="getStudents()">Load Students</button>

        <ul id="studentsList"></ul>

        <hr>

        <h2>My Result</h2>

<div id="result"></div>

<button onclick="loadMyResult()">Load Result</button>
<button onclick="logout()">Logout</button>

<script src="app.js"></script>

        <script src="sendStudentData.js"></script>
    </body>
</html>
